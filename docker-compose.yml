# RegWatch : `docker compose up -d` démarre la stack par défaut.
# Le LLM local (fallback) est optionnel : `docker compose --profile local-llm up -d`.
# Budget mémoire par défaut ≈ 6,5 Go (limites ci-dessous) — voir docs/adr/0004.
name: regwatch

x-ollama-healthcheck: &ollama-healthcheck
  test: ["CMD", "ollama", "list"]
  interval: 10s
  timeout: 5s
  retries: 12

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regwatch}
      POSTGRES_USER: ${POSTGRES_USER:-regwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regwatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m

  # Ollama dédié aux embeddings (bge-m3, ~1,2 Go). Aucun LLM de chat ici.
  ollama:
    image: ollama/ollama:0.40.6
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m # garde bge-m3 chargé entre deux lots d'ingestion
      OLLAMA_MAX_LOADED_MODELS: 1
    healthcheck: *ollama-healthcheck
    deploy:
      resources:
        limits:
          memory: 2g

  # Conteneur éphémère : télécharge le modèle d'embedding au premier lancement puis s'arrête.
  ollama-init:
    image: ollama/ollama:0.40.6
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-bge-m3}"]
    restart: "no"

  reranker:
    build: ./reranker
    image: regwatch-reranker
    ports:
      - "8000:8000"
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      - hf-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Premier démarrage : téléchargement du modèle (~2,3 Go).
      start_period: 15m
    deploy:
      resources:
        limits:
          memory: 3g

  backend:
    build: ./backend
    image: regwatch-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Vide par défaut : les endpoints de diagnostic (profil dev) restent fermés.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-regwatch}
      POSTGRES_USER: ${POSTGRES_USER:-regwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regwatch}
      LLM_CHAIN: ${LLM_CHAIN:-groq,gemini,ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_LLM_BASE_URL: http://ollama-llm:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      RERANKER_BASE_URL: http://reranker:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness seulement : le backend est "sain" même si le reranker charge encore.
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    build: ./frontend
    image: regwatch-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

  # --- Profil "local-llm" : LLM de fallback en local, uniquement sur demande ---
  ollama-llm:
    profiles: [local-llm]
    image: ollama/ollama:0.40.6
    ports:
      - "11435:11434"
    volumes:
      - ollama-llm:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    healthcheck: *ollama-healthcheck
    deploy:
      resources:
        limits:
          memory: 5g
        # GPU NVIDIA (Docker Desktop + WSL2) : décommenter pour accélérer l'inférence.
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

  ollama-llm-init:
    profiles: [local-llm]
    image: ollama/ollama:0.40.6
    depends_on:
      ollama-llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama-llm:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_LLM_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  pgdata:
  ollama:
  ollama-llm:
  hf-models:
