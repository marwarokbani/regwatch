server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Même origine pour l'UI et l'API : pas de configuration CORS à maintenir.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Les analyses et les uploads peuvent être longs.
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    location = /health {
        proxy_pass http://backend:8080;
    }

    # Application monopage : toute route inconnue renvoie index.html, le routeur Angular prend le relais.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
